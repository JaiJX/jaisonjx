<svg width="500" height="500" viewBox="0 0 500 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>JJ Logo</title>

  <!-- Outer dark circle -->
  <circle cx="250" cy="250" r="230" fill="#111111"/>

  <!-- Orange filled circle -->
  <circle cx="250" cy="250" r="185" fill="#ff6b1a"/>

  <!-- Rotated square -->
  <rect x="172" y="172" width="156" height="156" rx="8" fill="#111111" transform="rotate(45 250 250)"/>

  <!-- Inner orange diamond -->
  <rect x="205" y="205" width="90" height="90" rx="4" fill="#ff6b1a" transform="rotate(45 250 250)"/>

  <!-- JJ letters (system serif — external fonts don't load in favicon context) -->
  <text x="250" y="282" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="155"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-2">JJ</text>

  <!-- Outer ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#ff6b1a" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#ff6b1a" stroke-width="1" opacity="0.5"/>

  <!-- Dot accents -->
  <circle cx="250" cy="22" r="6" fill="#ff6b1a"/>
  <circle cx="250" cy="478" r="6" fill="#ff6b1a"/>
  <circle cx="22" cy="250" r="6" fill="#ff6b1a"/>
  <circle cx="478" cy="250" r="6" fill="#ff6b1a"/>
</svg>
