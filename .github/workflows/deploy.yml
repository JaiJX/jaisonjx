name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_NEON_DATABASE_URL: ${{ vars.NEON_DATABASE_URL }}
          VITE_BOOK_API_KEY: ${{ secrets.VITE_BOOK_API_KEY }}

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Resolve status and target
        id: notify
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "target=slack" >> "$GITHUB_OUTPUT"
          else
            echo "target=discord" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        if: ${{ steps.notify.outputs.target == 'slack' }}
        env:
          STATUS: ${{ steps.notify.outputs.status }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COLOR=good
          [ "$STATUS" != "success" ] && COLOR=danger

          PAYLOAD=$(jq -n \
            --arg title "Deploy $STATUS: $REPO" \
            --arg branch "$REF_NAME" \
            --arg actor "$ACTOR" \
            --arg url "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
            --arg color "$COLOR" \
            '{attachments:[{color:$color,title:$title,title_link:$url,fields:[{title:"Branch",value:$branch,short:true},{title:"Triggered by",value:$actor,short:true}]}]}')

          curl -H 'Content-Type: application/json' -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Notify Discord
        if: ${{ steps.notify.outputs.target == 'discord' }}
        env:
          STATUS: ${{ steps.notify.outputs.status }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COLOR=3066993
          [ "$STATUS" != "success" ] && COLOR=15158332

          PAYLOAD=$(jq -n \
            --arg title "Deploy $STATUS: $REPO" \
            --arg branch "$REF_NAME" \
            --arg actor "$ACTOR" \
            --arg url "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
            --argjson color "$COLOR" \
            '{embeds:[{title:$title,color:$color,fields:[{name:"Branch",value:$branch,inline:true},{name:"Triggered by",value:$actor,inline:true}],url:$url}]}')

          curl -H 'Content-Type: application/json' -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
