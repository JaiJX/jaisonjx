name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_NEON_DATABASE_URL: ${{ vars.NEON_DATABASE_URL }}
          VITE_BOOK_API_KEY: ${{ secrets.VITE_BOOK_API_KEY }}

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Slack
        if: always()
        env:
          STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COLOR=good
          [ "$STATUS" != "success" ] && COLOR=danger

          PAYLOAD=$(jq -n \
            --arg title "Deploy $STATUS: $REPO" \
            --arg branch "$REF_NAME" \
            --arg actor "$ACTOR" \
            --arg url "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
            --arg color "$COLOR" \
            '{attachments:[{color:$color,title:$title,title_link:$url,fields:[{title:"Branch",value:$branch,short:true},{title:"Triggered by",value:$actor,short:true}]}]}')

          curl -H 'Content-Type: application/json' -d "$PAYLOAD" "$SLACK_WEBHOOK_URL"
